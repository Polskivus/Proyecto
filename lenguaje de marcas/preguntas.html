<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Atrapa un Millón</title>
  <style>
        /* Estilos generales de la página */
    body {
      font-family: Arial, sans-serif;
      background: #0b1c2d;
      color: white;
      text-align: center;
      padding: 24px;
    }
    .panel {
      max-width: 720px;
      margin: 0 auto;
    }
    #progreso {
      opacity: 0.85;
      margin: 10px 0 18px;
    }
    #pregunta {
      margin: 14px 0 18px;
      line-height: 1.3;
    }
    .respuesta {
      display: block;
      margin: 10px auto;
      padding: 12px;
      width: min(520px, 90vw);
      font-size: 16px;
      cursor: pointer;
      border: 0;
      border-radius: 10px;
      background: #12395e;
      color: white;
      transition: transform 0.05s ease;
    }
    .respuesta:active { transform: scale(0.99); }
    #resultado {
      min-height: 22px;
      margin-top: 14px;
      opacity: 0.95;
    }
    #reiniciar {
      display: none;
      margin: 18px auto 0;
      padding: 12px 18px;
      border-radius: 10px;
      border: 0;
      cursor: pointer;
      background: #2a8bff;
      color: white;
      font-size: 16px;
    }
    .nota {
      opacity: 0.8;
      font-size: 14px;
      margin-top: 10px;
      line-height: 1.25;
    }
    #homeBtn {
      position: absolute;
      top: 24px;
      left: 24px;
      padding: 8px 16px;
      background: #2a8bff;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

  </style>
</head>
<body>
  <!-- Botón para volver a index.html -->
  <button id="homeBtn" onclick="location.href='index.html'">Volver</button>

    <h1>Atrapa un Millón</h1>

    <!-- Aquí se generan dinámicamente los botones con las opciones -->

    <!-- Mensaje tras responder -->
    <p id="resultado"></p>
    <!-- Botón para reiniciar el juego (se muestra al terminar) -->
    <button id="reiniciar">Reiniciar</button>

    <p class="nota" id="nota"></p>
  </div>

        ],

      },
      {

        texto: "Indefinido - ¿Cuáles dos contratos se consideran indefinidos?",
        opciones: [
          "Ordinario",
          "Formación en alternancia",
          "Fijo-discontinuo",
          "Contrato de relevo"
        ],
        correcta: null // es de selección múltiple (2 correctas) → no cuenta para nota con este formato
      },
      {
        id: 24,
        texto: "En un contrato fijo-discontinuo, se considera que tienes el puesto fijo, pero ¿de qué depende para que vuelvas a la producción?",
        opciones: [
          "Por temporada (ej. temporada de verano).",
          "Por producción.",
          "Porque el empresario quiere o el empleado quiere."
        ],
        correcta: 0
      },
      {
    id: 24,
    texto: "En un contrato fijo-discontinuo, se considera que tienes el puesto fijo, pero ¿de qué depende para que vuelvas a la producción?",
    opciones: [
      "Por temporada (ej. temporada de verano)",
      "Por producción",
      "Porque el empresario quiere o el empleado quiere"
    ],
    correcta: 0
  },
  {
    id: 25,
    texto: "Contrato temporal - ¿Cuál es la característica principal de este contrato?",
    opciones: [
      "Tiene fecha de inicio y fin definida",
      "Es indefinido",
      "Solo aplica a trabajadores autónomos",
      "No cotiza a la Seguridad Social"
    ],
    correcta: 0
  },
  {
    id: 26,
    texto: "Contrato formativo - ¿Qué permite este tipo de contrato?",
    opciones: [
      "Combinar trabajo con formación",

  },
  {

    ],
    correcta: 0
  },
      {

      },
      {

        ],
        correcta: 3

      {

      {

        ],

      },
      {

        texto: "El derecho a vacaciones…",
        opciones: ["Es anual", "Es obligatorio", "Son renunciable", "Depende del rendimiento del trabajador"],
        correcta: 2 // parece que hay más de una verdadera → no cuenta para nota
      },
      {
        id: 38,
        texto: "El CC TIC puede ayudarte a mejorar tus condiciones laborales, ¿en cuál de ellas no?",
        opciones: ["Salario", "Vacaciones", "Indemnizaciones", "Derechos fundamentales"],
        correcta: 3
      },
      {
        id: 39,
        texto: "¿Cómo se le llama al hecho de que, en caso de que el convenio tenga mejores condiciones que el estatuto, te atengas a estas?",
        opciones: [

          "Principio de condición más beneficiosa"

    // Índice de la pregunta actual en el array "preguntas"
    let indice = 0;
    // Contador de respuestas correctas (solo de preguntas corregibles)
    let aciertos = 0;
    // Calcula cuántas preguntas cuentan (correcta != null/undefined)
    const totalCorregibles = preguntas.filter(p => p.correcta !== null && p.correcta !== undefined).length;
    // Preguntas que NO cuentan para nota (sin clave / multi-respuesta)
    const sinClave = preguntas.length - totalCorregibles;
    // Referencias a elementos del DOM (así no hacemos getElementById todo el rato)
    const elPregunta = document.getElementById("pregunta");
    const elOpciones = document.getElementById("opciones");
    const elResultado = document.getElementById("resultado");
    const elProgreso = document.getElementById("progreso");
    const elReiniciar = document.getElementById("reiniciar");
    const elNota = document.getElementById("nota");
// Pinta la pregunta actual y crea los botones de respuesta dinámicamente
    function mostrarPregunta() {
      // Limpia mensajes y botones anteriores
      elResultado.textContent = "";
      elOpciones.innerHTML = "";
      // Si ya no quedan preguntas, se termina el juego
      if (indice >= preguntas.length) {
        terminar();
        return;
      }
      // Coge la pregunta actual
      const p = preguntas[indice];
      elProgreso.textContent = `Pregunta ${indice + 1} / ${preguntas.length}`;
      elPregunta.textContent = p.texto;

      p.opciones.forEach((op, i) => {
        const btn = document.createElement("button");
        btn.className = "respuesta";
        btn.textContent = op;
        btn.addEventListener("click", () => responder(i));
        elOpciones.appendChild(btn);
      });
      // Crea un botón por cada opción y le asigna un listener de click
      if (p.correcta === null || p.correcta === undefined) {
        elNota.textContent = "Esta pregunta no cuenta para la nota (enunciado incompleto o múltiples respuestas).";
      } else {
        elNota.textContent = "";
      }
    }
    // Gestiona la respuesta del usuario y decide si suma puntos o no
    function responder(opcionElegida) {
      const p = preguntas[indice];
       // Si no hay respuesta correcta definida, solo registra y no suma/ resta
      if (p.correcta === null || p.correcta === undefined) {
        elResultado.textContent = "Respuesta registrada.";
       // - Si correcta fuera un array (multi-respuesta), comprueba includes
       // - Si es un número, compara directamente
      } else {
        const esCorrecta = Array.isArray(p.correcta)
          ? p.correcta.includes(opcionElegida)
          : opcionElegida === p.correcta;

        if (esCorrecta) {
          aciertos++;
          elResultado.textContent = "Correcto.";
        } else {
          elResultado.textContent = "Incorrecto.";
        }
      }
      // Pasa a la siguiente pregunta
      indice++;
      setTimeout(mostrarPregunta, 450);
    }
    // Muestra pantalla final y activa el botón reiniciar
    function terminar() {
      elPregunta.textContent = "Juego terminado";
      elProgreso.textContent = "";
      elOpciones.innerHTML = "";
      // Mensaje final con aciertos y total corregible
      elResultado.textContent =
        `Has acertado ${aciertos} de ${totalCorregibles} preguntas corregibles` +
        (sinClave > 0 ? ` (${sinClave} no cuentan para la nota).` : ".");
      // Muestra el botón de reinicio
      elReiniciar.style.display = "inline-block";
      elNota.textContent = "";
    }
    // Listener del botón reiniciar: resetea variables y vuelve a empezar
    elReiniciar.addEventListener("click", () => {
      indice = 0;
      aciertos = 0;
      elReiniciar.style.display = "none";
      mostrarPregunta();
    });
    // Arranca el juego mostrando la primera pregunta
    mostrarPregunta();
  </script>
</body>
</html>
