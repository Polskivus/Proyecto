<!-- PARTE AIMAR -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Piezas coche y pared</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  

  <!-- Control velocidad -->
  <div class="control-velocidad">
    Velocidad pared
    <input type="range" min="0.5" max="5" step="0.1" value="2.9" id="velocidadPared">
  </div>

  <!-- Partes del coche y la escena -->
  <div class="escena">
    <div class="pieza motor">Motor</div>
    <div class="pieza rueda1">Rueda</div>
    <div class="pieza rueda2">Rueda</div>
    <div class="pieza puerta">Puerta</div>
    <div class="pieza techo">Techo</div>

    <!-- pared y explosion -->
    <div class="pared"></div>
    <div class="explosion" id="explosion"></div>
  </div>

  <button class="btn-index" onclick="location.href='index.html'">
      Volver al inicio
    </button>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const piezas = document.querySelectorAll(".pieza");
      const pared = document.querySelector(".pared");
      const controlVelocidad = document.getElementById("velocidadPared");

      // Control de rango de la velocidad de la pared (buscado info con ia pero hecho a mano)
      controlVelocidad.addEventListener("input", () => {
        document.documentElement.style.setProperty(
          "--velocidad-pared",
          controlVelocidad.value + "s"
        );
      });

      // INICIO IA
      function comprobarColision() {
        const rectanguloPared = pared.getBoundingClientRect();

        piezas.forEach(pieza => {
          if (pieza.dataset.detendida) return;

          const rectanguloPieza = pieza.getBoundingClientRect();

          const colision =
            rectanguloPieza.right >= rectanguloPared.left &&
            rectanguloPieza.left <= rectanguloPared.right &&
            rectanguloPieza.bottom >= rectanguloPared.top &&
            rectanguloPieza.top <= rectanguloPared.bottom;

          if (colision) {
            pieza.style.animationPlayState = "paused";
            pieza.dataset.detendida = "true";
          }
        });
      }

      setInterval(comprobarColision, 20);
    });
    // FIN IA
  </script>

</body>
</html>
